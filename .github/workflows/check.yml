# Checks the game files on every push. Publishing is done by GitHub Pages itself:
# Settings -> Pages -> Source: "Deploy from a branch" -> main / (root).
name: Check game files

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts, recipes, pictures, voice recordings and the offline file list
        run: |
          for f in js/*.js sw.js assets/voice/index.js tools/*.js; do node --check "$f"; done
          node tools/check.js
